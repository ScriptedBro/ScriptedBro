<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="1000" height="280" rx="18" fill="url(#grid)" />

  <!-- Glowing Orbs -->
  <circle cx="150" cy="60" r="95" fill="#3B82F6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="90;115;90" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="90" r="110" fill="#8B5CF6" opacity="0.14" filter="url(#glow)">
    <animate attributeName="r" values="105;130;105" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Waves -->
  <path d="M 0 215 Q 250 165 500 215 T 1000 215 L 1000 280 L 0 280 Z" fill="url(#wave1)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M 0 215 Q 250 165 500 215 T 1000 215 L 1000 280 L 0 280 Z;
              M 0 215 Q 250 250 500 205 T 1000 220 L 1000 280 L 0 280 Z;
              M 0 215 Q 250 165 500 215 T 1000 215 L 1000 280 L 0 280 Z" />
  </path>
  <path d="M 0 235 Q 250 265 500 225 T 1000 235 L 1000 280 L 0 280 Z" fill="url(#wave2)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M 0 235 Q 250 265 500 225 T 1000 235 L 1000 280 L 0 280 Z;
              M 0 235 Q 250 190 500 245 T 1000 230 L 1000 280 L 0 280 Z;
              M 0 235 Q 250 265 500 225 T 1000 235 L 1000 280 L 0 280 Z" />
  </path>

  <!-- Top Status Pill -->
  <g transform="translate(360, 26)">
    <rect width="280" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <circle cx="18" cy="14" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="148" y="18" font-family="'Segoe UI', Ubuntu, Sans-Serif" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1.2">AVAILABLE FOR COLLABORATION</text>
  </g>

  <!-- Main Title -->
  <text x="500" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-0.5">
    Fredrick · @ScriptedBro
  </text>

  <!-- Subtitle -->
  <text x="500" y="156" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.4">
    Full-Stack Web3 Engineer  •  Autonomous AI Agents &amp; PayFi  •  Zero-Knowledge Proofs
  </text>

  <!-- Tagline Pills -->
  <g transform="translate(155, 184)" font-family="'Segoe UI', Ubuntu, monospace" font-size="12.5" font-weight="600">
    <rect x="0" y="0" width="155" height="30" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <text x="77.5" y="19.5" fill="#38BDF8" text-anchor="middle">⛓️ Stellar &amp; Soroban</text>

    <rect x="170" y="0" width="165" height="30" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" />
    <text x="252.5" y="19.5" fill="#818CF8" text-anchor="middle">🤖 AI Agent Escrows</text>

    <rect x="350" y="0" width="160" height="30" rx="8" fill="#1E293B" stroke="#C084FC" stroke-width="1" stroke-opacity="0.5" />
    <text x="430" y="19.5" fill="#C084FC" text-anchor="middle">🔐 Noir ZK &amp; Privacy</text>

    <rect x="525" y="0" width="165" height="30" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1" stroke-opacity="0.5" />
    <text x="607.5" y="19.5" fill="#34D399" text-anchor="middle">🎮 Gaming &amp; Anime</text>
  </g>
</svg>
